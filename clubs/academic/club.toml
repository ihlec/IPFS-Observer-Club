id = "academic"
name = "Academic"
prompt_ver = "4"
in_scope_description = "True when the content has academic origin: a paper, thesis, course note, dataset, repository record, or scholarly page from a university or research host, including a landing page or short excerpt. A DOI, arXiv id, ORCID, university host, or repository host (Zenodo, PubMed, OSF, HAL, JSTOR) is enough. False for shopping, login walls, software documentation, or personal blogs with no scholarly affiliation. Do not reject HTML or a missing Abstract."

